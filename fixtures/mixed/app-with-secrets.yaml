apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-with-secrets
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-with-secrets
  template:
    metadata:
      labels:
        app: app-with-secrets
    spec:
      serviceAccountName: default
      containers:
        - name: app
          image: myapp:latest
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: password
            - name: API_KEY
              value: "sk-live-abc123xyz789"
          envFrom:
            - configMapRef:
                name: app-config
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: production
type: Opaque
stringData:
  password: "SuperSecret123!"
  api-token: "tok_live_abcdefghijklmnop"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
data:
  database-url: "postgresql://user:pass@db:5432/prod"
  redis-url: "redis://redis:6379"