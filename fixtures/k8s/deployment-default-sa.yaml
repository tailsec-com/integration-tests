apiVersion: apps/v1
kind: Deployment
metadata:
  name: default-sa-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: default-sa-app
  template:
    metadata:
      labels:
        app: default-sa-app
    spec:
      serviceAccountName: default
      containers:
        - name: app
          image: nginx:1.21
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
            requests:
              cpu: "250m"
              memory: "64Mi"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: default