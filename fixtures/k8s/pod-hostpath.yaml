apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.35
      command: ["sh", "-c", "echo hello"]
      volumeMounts:
        - name: host-volume
          mountPath: /host-data
      securityContext:
        runAsUser: 0
        runAsGroup: 0
  volumes:
    - name: host-volume
      hostPath:
        path: /etc
        type: Directory